<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Hebreo desde Álef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&text=%E2%9C%93%E2%9C%95%F0%9F%8D%9E%F0%9F%A5%9B%F0%9F%A5%9A%F0%9F%A7%80%F0%9F%8D%8E%F0%9F%8D%8C%F0%9F%8D%85%F0%9F%A5%92%F0%9F%8D%9A%F0%9F%92%A7%E2%98%95%F0%9F%90%9F%F0%9F%8D%97%F0%9F%8D%AB%F0%9F%8D%93%F0%9F%A5%95%F0%9F%A7%85%F0%9F%8D%B7%F0%9F%8F%A6%F0%9F%8F%96%EF%B8%8F%F0%9F%A7%BA%F0%9F%8F%A8%F0%9F%8C%B3%F0%9F%8D%BD%EF%B8%8F%F0%9F%8F%A5%F0%9F%8F%AB%F0%9F%9A%8F%E2%9C%88%EF%B8%8F%F0%9F%9B%8D%EF%B8%8F%F0%9F%93%AE%E2%98%85%E2%98%86%F0%9F%8D%B5%F0%9F%A5%90%F0%9F%A5%A1%F0%9F%9A%95%F0%9F%9B%92%F0%9F%AA%99%F0%9F%91%AA%F0%9F%A9%BA%F0%9F%8F%A0%F0%9F%91%95%F0%9F%9A%8C%F0%9F%93%85%F0%9F%94%A2%F0%9F%92%BC%F0%9F%8E%AC%F0%9F%92%A1%F0%9F%8E%A8%F0%9F%94%91%F0%9F%92%AC%F0%9F%94%81%F0%9F%94%97%F0%9F%93%98&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one reading column, sticky top bar, bottom sheet for letter/word details. Light-only by request. */
:root{
  --paper:#F7F9FC; --card:#FFFFFF; --ink:#1E2A3F; --muted:#5B687D; --line:#E1E7F0;
  --accent:#2A5FC4; --accent-soft:#E6EDFB; --on-accent:#FFFFFF;
  --ok:#3D7A2A; --ok-soft:#E7F3E0; --bad:#B4384A; --bad-soft:#FBE7EA; --hl:#FFEFC2; --gold:#9A6B00;
  --shadow:0 10px 30px rgba(30,42,63,.10);
  --coin:#F3E4B5; --coin-edge:#C9A245; --bill:#DCEFE2; --bill-edge:#7DB08E;
  --ui:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
  --he:"Noto Sans Hebrew","Arial Hebrew","Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--ui);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.he{font-family:var(--he);direction:rtl;unicode-bidi:isolate}
.say{cursor:pointer;border-bottom:1px dotted var(--accent)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:780px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;font-size:18px;background:none;border:0;padding:0;cursor:pointer}
.brand .he{color:var(--accent);font-size:20px;font-weight:600}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav button{border:0;background:none;padding:6px 10px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover,.nav button.on{background:var(--accent-soft);color:var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:12px;line-height:20px;text-align:center;margin-left:4px;font-variant-numeric:tabular-nums}
.streak{font-size:13px;color:var(--gold);font-weight:500}
.wrap{max-width:780px;margin:0 auto;padding-block:22px 140px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.sheet-open .wrap{padding-bottom:55vh}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,36px);font-weight:700}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.stack{display:grid;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:default}
.btn svg,.spk svg,.play svg{width:18px;height:18px;fill:currentColor}
.muted{color:var(--muted)}
.hint{color:var(--muted);max-width:62ch}
.back{border:0;background:none;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:500}

/* Home */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;padding:24px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.hero p{color:var(--muted);margin-top:10px;max-width:56ch}
.hero .row{margin-top:18px}
.hero-word{font-family:var(--he);font-size:clamp(46px,10vw,72px);direction:rtl;line-height:1.6;color:var(--accent);text-align:center}
.hero-word button{border:0;background:none;padding:0 1px;border-radius:8px;cursor:pointer;font:inherit;color:inherit}
.hero-word button:hover{background:var(--hl)}
.hero-cap{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.voice-warn{padding:12px 16px;border-radius:12px;background:var(--hl);font-size:14px}
.units{display:grid;gap:10px}
.unit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;width:100%}
.unit:hover{border-color:var(--accent)}
.unit.next{border-color:var(--accent);box-shadow:var(--shadow)}
.num{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;line-height:1}
.num b{font-family:var(--he);font-size:24px;font-weight:600}
.num small{font-size:10px;color:var(--muted)}
.unit.complete .num{background:var(--ok-soft);color:var(--ok)}
.u-main{display:grid;gap:2px;min-width:0}
.u-kind{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.u-title{font-weight:600;font-size:17px}
.u-title .he{color:var(--muted);font-weight:400;font-size:16px;margin-left:6px}
.u-sub{font-size:14px;color:var(--muted)}
.pills{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.pill.on{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chev{font-size:24px;color:var(--muted)}
.method{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.method summary{cursor:pointer;font-weight:600}
.method ul{margin:12px 0 0;padding-left:18px;display:grid;gap:8px;color:var(--ink)}
.method li b{font-weight:600}

/* Unit */
.u-head{display:grid;gap:6px;margin:8px 0 16px}
.u-head .he-t{font-family:var(--he);font-size:28px;color:var(--accent);direction:rtl;text-align:left}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap;font-weight:500}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs button.done:not(.on){color:var(--ok);border-color:var(--ok)}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.chk{display:inline-flex;gap:6px;align-items:center;cursor:pointer}
.chk select{font:inherit;padding:3px 6px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.text{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 0}
.line{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:14px 18px;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:0}
.line.speaking{background:var(--accent-soft)}
.play,.spk{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:grid;place-items:center;color:var(--accent)}
.play:hover,.spk:hover{background:var(--accent-soft)}
.l-body{display:grid;gap:4px;min-width:0}
.heline{font-family:var(--he);font-size:clamp(26px,6vw,34px);line-height:2;direction:rtl;text-align:right}
.w,.ch{border-radius:6px;transition:background .15s}
.mode-w .w{cursor:pointer;padding:0 2px}
.mode-w .w:hover{background:var(--accent-soft)}
.mode-l .ch{cursor:pointer}
.mode-l .ch:hover{background:var(--hl)}
.sel{background:var(--hl)!important}
.tr{color:var(--muted);font-size:15px;font-style:italic}
.reveal{justify-self:start;border:0;background:none;color:var(--accent);cursor:pointer;font-size:14px;padding:2px 0}
.es{font-size:15px}

/* Etiqueta rápida bajo la palabra */
#pop{position:absolute;z-index:45;transform:translateX(-50%);background:var(--ink);color:var(--paper);border-radius:10px;padding:3px 4px 3px 10px;font-size:15px;line-height:1.4;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);white-space:nowrap}
#pop::before{content:"";position:absolute;top:-5px;left:calc(50% + var(--ax,0px));margin-left:-5px;border:5px solid transparent;border-top:0;border-bottom-color:var(--ink)}
#pop .dim{opacity:.7;font-size:13px}
#pop button{border:0;background:var(--accent);color:var(--on-accent);border-radius:7px;padding:1px 8px;cursor:pointer;font-size:12px}
/* Sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -12px 34px rgba(30,42,63,.14);border-radius:22px 22px 0 0;max-height:50vh;overflow:auto;padding-top:18px;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-in{max-width:780px;margin:0 auto;position:relative;display:grid;gap:14px}
.x{position:absolute;top:-6px;right:0;border:0;background:var(--paper);width:34px;height:34px;border-radius:50%;cursor:pointer}
.sh-top{display:flex;gap:20px;align-items:center;flex-wrap:wrap;padding-right:40px}
.big{font-family:var(--he);font-size:56px;line-height:1.5;color:var(--accent);direction:rtl}
.tr-b{font-size:20px;font-style:italic}
.es-b{font-size:18px;font-weight:600}
.note{font-size:14px;color:var(--muted);max-width:62ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px 16px}
.sh-top>div:last-child{flex:1;min-width:220px}
.facts div{display:grid;justify-items:start}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.facts b{font-size:18px}
.mini{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.mini button{font-family:var(--he);font-size:26px;min-width:46px;padding:2px 8px;border:1px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer}
.mini button:hover{background:var(--hl)}

/* Letter grids */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.lcard{display:grid;justify-items:center;gap:0;padding:10px 6px;border:1px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer}
.lcard:hover{border-color:var(--accent)}
.lcard .he{font-size:34px;line-height:1.5;color:var(--accent)}
.lcard b{font-size:14px;font-weight:600}
.lcard small{font-size:12px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:8px}
.card .he{font-size:1.25em}

/* Exercises */
.run-top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-bottom:22px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.cnt{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.ex{display:grid;gap:16px}
.ex-type{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ex-head{display:flex;gap:12px;align-items:center}
.q-big{font-family:var(--he);font-size:64px;line-height:1.5;text-align:center;direction:rtl;color:var(--ink)}
.q-sound{font-size:40px;text-align:center;font-style:italic;color:var(--accent)}
.q-sent{font-family:var(--he);font-size:30px;line-height:2;text-align:center;direction:rtl}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);color:transparent}
.q-help{color:var(--muted);text-align:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{min-height:58px;padding:10px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;font-size:17px;text-align:center}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt.he{font-size:26px}
.opt.ok{background:var(--ok-soft);border-color:var(--ok)}
.opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.answer{min-height:66px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;direction:rtl;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px;direction:rtl;justify-content:center}
.tile{font-family:var(--he);font-size:28px;padding:4px 14px;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:12px;background:var(--card);cursor:pointer}
.tile.wd{font-size:22px}
.tile:hover{border-color:var(--accent)}
.tile[hidden]{display:none}
.fb{border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.fb.ok{background:var(--ok-soft)}
.fb.bad{background:var(--bad-soft)}
.fb h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.shadow-line{font-family:var(--he);font-size:32px;line-height:2;direction:rtl;text-align:center}
.score{font-size:56px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.wlist{display:grid;gap:6px}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:12px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;text-align:left;width:100%}
.wrow .he{font-size:22px;text-align:right}
.lvl{display:flex;gap:2px}
.lvl i{width:6px;height:14px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--ok)}
table.vt{border-collapse:collapse;width:100%;background:var(--card);border-radius:14px;overflow:hidden}
.vt td,.vt th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.vt th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.vt .he{font-size:28px;color:var(--accent)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px}

.answer:empty::before{content:attr(data-ph);color:var(--muted);font-family:var(--ui);font-size:14px;padding:0 6px}
.nav .ni{display:none}
/* Minijuegos */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.gcard{display:grid;gap:2px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;align-content:start}
.gcard:hover{border-color:var(--accent)}
.gcard .emo{font-size:34px;line-height:1.3}
.gcard b{font-size:16px}
.gcard .he{color:var(--accent);font-size:17px;text-align:left}
.gcard small{color:var(--muted);font-size:13px}
.stars{color:var(--gold);letter-spacing:2px;font-size:14px}
.big-stars{color:var(--gold);font-size:44px;letter-spacing:6px}
.glist{display:flex;flex-wrap:wrap;gap:8px;direction:rtl}
.chipw{display:inline-flex;transition:opacity .2s}
.chipw.got{opacity:.4;text-decoration:line-through}
.chip,.phr{font:inherit;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:4px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.chip.he,.phr{font-family:var(--he);font-size:22px}
.chip svg{width:16px;height:16px;fill:var(--accent)}
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px;border-radius:16px;background:var(--accent-soft)}
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.prod{display:grid;justify-items:center;align-content:center;min-height:88px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);cursor:pointer;padding:6px 2px;gap:2px}
.prod .emo{font-size:36px;line-height:1.2}
.emo,.route{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",var(--ui)}
.prod .pl{font-size:14px;min-height:20px;text-align:center}
.prod .pl.he{font-size:17px}
.prod.yes{border-color:var(--ok);background:var(--ok-soft)}
.prod.no{border-color:var(--bad);background:var(--bad-soft)}
.prod:disabled{cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.say-line{display:flex;flex-wrap:wrap;gap:6px;direction:rtl}
.money{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.coin{width:58px;height:58px;border-radius:50%;background:var(--coin);border:3px solid var(--coin-edge);font-weight:700;cursor:pointer;font-size:15px;color:var(--ink)}
.bill{width:88px;height:50px;border-radius:8px;background:var(--bill);border:2px solid var(--bill-edge);font-weight:700;cursor:pointer;font-size:16px;color:var(--ink)}
.tray{min-height:74px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.tray .coin{width:44px;height:44px;font-size:12px}
.tray .bill{width:66px;height:40px;font-size:13px}
.tray:empty::before{content:"Toca monedas y billetes para pagar";color:var(--muted);font-size:14px}
.chat{display:grid;gap:8px}
.bub{max-width:88%;padding:8px 14px;border-radius:16px;display:grid;gap:2px;justify-items:start}
.bub.them{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.me{justify-self:end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px;justify-items:end}
.bub .who{font-size:11px;opacity:.75}
.bub .phr{border:0;background:none;padding:0;color:inherit;font-size:24px}
.bub .t{font-size:13px;font-style:italic;opacity:.85}
.bub details{font-size:13px;color:var(--muted)}
.bub summary{cursor:pointer;color:var(--accent)}
.goal{display:flex;flex-wrap:wrap;gap:6px 12px;padding:12px 14px;border-radius:14px;background:var(--hl);font-size:15px}
.opt .t{display:block;font-family:var(--ui);font-size:13px;font-style:italic;color:var(--muted);direction:ltr}
.arrows{display:flex;gap:12px;justify-content:center}
.arrows button{width:78px;height:64px;font-size:30px;border-radius:16px;border:1.5px solid var(--line);border-bottom-width:3px;background:var(--card);cursor:pointer;color:var(--ink)}
.arrows button:hover{border-color:var(--accent)}
.route{font-size:26px;text-align:center;min-height:36px;letter-spacing:6px;color:var(--accent)}
.search{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.bar.thin{display:block;height:6px;margin-top:6px}
.meta{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.meta .he{font-size:15px}
.ct tr[data-say]{cursor:pointer}
.ct tr[data-say]:hover{background:var(--accent-soft)}
.ct td.he{font-size:22px;color:var(--accent)}
.ct td:first-child .he{font-size:16px;color:var(--ink)}
.ct th{background:var(--paper);color:var(--ink);font-size:13px}
#sheet.tall{max-height:85vh}
.flash{justify-items:center;text-align:center}
.flash .facts{text-align:left}
@media (max-width:640px){
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:25;margin:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding-top:4px;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px));padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .nav button{display:grid;justify-items:center;gap:1px;font-size:11px;border-radius:10px;padding:4px 2px;position:relative}
  .nav .ni{display:block;width:22px;height:22px;fill:currentColor;font-family:var(--he);font-size:20px;line-height:22px;text-align:center}
  .nav .badge{position:absolute;top:0;left:calc(50% + 6px);margin:0}
  .tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
  .tabs button{padding:8px 2px;font-size:13px}
  .shelf{gap:6px;padding:8px}
  .prod{min-height:78px}
  .prod .emo{font-size:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  if(b==='ו'&&!vk&&dg)return{L,cons:'',v:['Shuruk (וּ)','u'],syl:'u',note:'Aquí la ו no es consonante: es la vocal u.'};
  if(b==='ו'&&(vk==='ֹ'||vk==='ֺ')&&m.filter(x=>V[x]).length===1)return{L,cons:'',v:['Jolam malé (וֹ)','o'],syl:'o',note:'Aquí la ו no es consonante: es la vocal o.'};
  if(c.length===1)return{L,cons:L[2],v:null,syl:'',note:''};
  const v=vk?V[vk]:null;let syl,note='';
  if(!v){if('אעהי'.includes(b)){syl='';note='Sin vocal propia: aquí no suena, solo alarga la vocal anterior.'}else{syl=cons;note='Sin vocal: se pronuncia la consonante sola.'}}
  else if(vk==='ְ'){syl='ךםןףץ'.includes(b)||!cons?cons:cons+'(e)';note='La shvá suena como una e muy breve (sobre todo al inicio de palabra) o no suena.'}
  else syl=cons+v[2];
  if(dg&&DG[b])note=(note?note+' ':'')+'El punto dentro (dagesh) hace que suene '+DG[b]+' y no '+SND[b]+'.';
  return{L,cons,v,syl,note};
}

// ---------- Generadores de ejercicios ----------
function ch(title,prompt,opts,ex){const order=shuffle(opts.map((o,i)=>i));return Object.assign({kind:'choice',title,prompt,opts:order.map(i=>opts[i]),ans:order.indexOf(0)},ex||{})}
const wordExp=w=>`<span class="he say" style="font-size:24px">${w.k}</span> · <i>${w.tr}</i> · ${w.es}`;
const G={
  letterName(x){const ls=x.letters;const b=pick(ls);const wrong=shuffle(uniqBy(ALEF.split('').filter(k=>LT[k][0]!==LT[b][0]&&!'ךםןףץ'.includes(k)),k=>LT[k][0])).slice(0,3);
    return ch('¿Cómo se llama esta letra?',`<div class="q-big">${b}</div>`,[b,...wrong].map(k=>({h:LT[k][0]})),{sayAfter:LT[b][1],key:'n'+b,explain:`<span class="he" style="font-size:26px">${b}</span> se llama <b>${LT[b][0]}</b> y suena <b>${LT[b][2]}</b>.`})},
  letterSound(x){if(x.syl.length<4)return null;const t=pick(x.syl);const o=shuffle(uniqBy(x.syl.filter(s=>s.s!==t.s),s=>s.s)).slice(0,3);if(o.length<3)return null;
    return ch('¿Cómo suena?',`<div class="q-big">${t.c}</div>`,[t,...o].map(s=>({h:s.s})),{sayAfter:t.c,key:'s'+t.c,explain:`<span class="he say" style="font-size:26px">${t.c}</span> se lee <b>${t.s}</b>.`})},
  soundLetter(x){if(x.syl.length<4)return null;const t=pick(x.syl);const o=shuffle(uniqBy(x.syl.filter(s=>s.s!==t.s),s=>s.s)).slice(0,3);if(o.length<3)return null;
    return ch('Escucha y elige lo que oyes',`<div class="q-sound">${t.s}</div>`,[t,...o].map(s=>({h:s.c,he:1})),{say:t.c,key:'a'+t.c,explain:`<b>${t.s}</b> se escribe <span class="he say" style="font-size:26px">${t.c}</span>.`})},
  listen(x,t){const p=x.pool;if(p.length<4)return null;t=t||pick(p);const o=shuffle(uniqBy(p.filter(w=>strip(w.k)!==strip(t.k)),w=>strip(w.k))).slice(0,3);if(o.length<3)return null;
    return ch('Escucha y elige la palabra','<p class="q-help">Toca el altavoz para oírla otra vez.</p>',[t,...o].map(w=>({h:w.k,he:1})),{say:t.k,word:t.k,explain:wordExp(t)})},
  meaning(x,t){const p=x.pool;if(p.length<4)return null;t=t||pick(p);const o=shuffle(uniqBy(p.filter(w=>w.es!==t.es&&w.k!==t.k),w=>w.es)).slice(0,3);if(o.length<3)return null;
    return ch('¿Qué significa?',`<div class="q-big">${t.k}</div>`,[t,...o].map(w=>({h:w.es})),{sayAfter:t.k,word:t.k,explain:wordExp(t)})},
  reverse(x,t){const p=x.pool;if(p.length<4)return null;t=t||pick(p);const o=shuffle(uniqBy(p.filter(w=>w.es!==t.es&&w.k!==t.k),w=>w.k)).slice(0,3);if(o.length<3)return null;
    return ch(`¿Cómo se dice «${t.es}»?`,'',[t,...o].map(w=>({h:w.k,he:1})),{sayAfter:t.k,word:t.k,explain:wordExp(t)})},
  build(x,t){const c=x.pool.filter(w=>{const n=clusters(w.k).length;return n>=2&&n<=7&&!w.k.includes(' ')});if(!c.length||(t&&!c.includes(t)))return null;t=t||pick(c);const tg=clusters(t.k);
    const bases=new Set(tg.map(c=>c[0]));const extra=shuffle(uniqBy(x.syl.filter(s=>!bases.has(s.c[0])),s=>s.c[0])).slice(0,2).map(s=>s.c);
    return{kind:'build',title:'Construye la palabra',prompt:`<p class="q-help" style="font-size:18px">«${t.es}» · <i>${t.tr}</i></p>`,target:tg,pieces:shuffle([...tg,...extra]),say:t.k,word:t.k,explain:wordExp(t)}},
  order(x){const ls=x.u.lines.filter(l=>l.w.length>=3&&l.w.length<=8);if(!ls.length)return null;const l=pick(ls);const tg=l.w.map(w=>bare(w[0]));
    return{kind:'build',words:true,title:'Ordena la oración',prompt:`<p class="q-help" style="font-size:18px">«${l.es}»</p>`,target:tg,pieces:shuffle(tg),sayAfter:lineText(l),key:'o'+l.es,explain:`<span class="he say" style="font-size:22px">${tg.join(' ')}</span><br><i>${l.w.map(w=>w[1]).join(' ')}</i>`}},
  cloze(x){const ls=x.u.lines.filter(l=>l.w.length>=3);if(!ls.length)return null;const l=pick(ls);
    const cand=l.w.map((w,i)=>i).filter(i=>{const w=WORDS[bare(l.w[i][0])];return w&&!w.name});if(!cand.length)return null;
    const i=pick(cand),t=WORDS[bare(l.w[i][0])];
    const o=shuffle(uniqBy(x.pool.filter(w=>w.k!==t.k&&!l.w.some(z=>bare(z[0])===w.k)),w=>w.k)).slice(0,3);if(o.length<3)return null;
    const sent=l.w.map((w,j)=>j===i?'<span class="gap">___</span>':bare(w[0])).join(' ');
    return ch('Completa la oración',`<div class="q-sent">${sent}</div><p class="q-help">«${l.es}»</p>`,[t,...o].map(w=>({h:w.k,he:1})),{sayAfter:lineText(l),word:t.k,key:'c'+l.es+i,explain:wordExp(t)})},
  shadow(x){const l=pick(x.u.lines);return{kind:'shadow',title:'Escucha y repite en voz alta',line:l,say:lineText(l),key:'h'+l.es}},
  grammar(x){const q=x.u.gram.quiz;if(!q.length)return null;const g=pick(q);
    return ch(g.q,'',g.o.map(h=>({h,he:isHeb(strip(h))})),{key:'g'+g.q,explain:`Respuesta: <b class="${isHeb(strip(g.o[0]))?'he say':''}">${g.o[0]}</b>`})},
};
const TYPE={letterName:'Letras',letterSound:'Fonética',soundLetter:'Fonética · audio',listen:'Comprensión auditiva',meaning:'Vocabulario',reverse:'Vocabulario',build:'Escritura',order:'Orden de palabras',cloze:'Lectura',shadow:'Pronunciación',grammar:'Gramática'};

function ctxFor(ui){
  const u=U[ui],syl=[],seen=new Set();
  u.lines.forEach(l=>l.w.forEach(w=>clusters(bare(w[0])).forEach(c=>{const I=info(c);if(I&&I.v&&I.syl&&!c.includes('\u05B0')&&!seen.has(c)){seen.add(c);syl.push({c,s:I.syl})}})));
  const own=u.words.filter(w=>!w.name);
  const old=U.slice(0,ui).flatMap(x=>x.words).filter(w=>!w.name&&S.srs[w.k]&&!own.includes(w));
  return{u,ui,syl,pool:[...own,...shuffle(old).slice(0,6)],letters:[...u.focus]};
}
function weights(i,mode){
  if(mode==='letters')return{letterName:3,letterSound:4,soundLetter:3};
  if(mode==='grammar')return{grammar:4,cloze:1.5,order:1};
  return{letterName:Math.max(2-i*.5,.2),letterSound:Math.max(3-i*.4,.6),soundLetter:Math.max(2.5-i*.3,.5),listen:2,meaning:1.2+i*.3,reverse:.3+i*.35,build:1+i*.15,order:.6+i*.3,cloze:i?.6+i*.3:0,shadow:1,grammar:i?.4+i*.25:.2};
}
function wpick(w){const e=Object.entries(w).filter(x=>x[1]>0);let r=Math.random()*e.reduce((s,x)=>s+x[1],0);for(const[k,v]of e){if((r-=v)<0)return k}return e[0][0]}
function makeSession(ui,mode,n){
  const x=ctxFor(ui),w=weights(ui,mode),out=[],used=new Set();let last='',tries=0;
  while(out.length<n&&tries++<300){const t=wpick(w);if(t===last&&tries<250)continue;const e=G[t](x);if(!e)continue;
    const k=t+(e.key||e.word||'');if(used.has(k))continue;used.add(k);e.type=t;out.push(e);last=t}
  return out;
}

let KEYH=null;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSheet();hidePop()}KEYH&&KEYH(e)});
function run(list,onFinish,backTo,retry){
  let i=0,ok=0;const total=list.length;
  function show(){
    chrome(null);if(i>=list.length)return finish();
    const e=list[i];
    app.innerHTML=`<div class="run-top"><button class="back" id="quit">✕ Salir</button><div class="bar"><span style="width:${i/list.length*100}%"></span></div><span class="cnt">${i+1} / ${list.length}</span></div>
     <div class="ex"><div class="ex-type">${e.tl||TYPE[e.type]||''}${e.retry?' · otra vez':''}</div>
     <div class="ex-head">${e.say?`<button class="spk" id="say" aria-label="Escuchar">${SPK}</button>`:''}<h2>${e.title}</h2></div>
     ${e.prompt||''}<div id="area"></div><div id="fb"></div></div>`;
    $('#quit').onclick=()=>{window.speechSynthesis&&speechSynthesis.cancel();backTo?backTo():home()};
    if(e.say){$('#say').onclick=()=>speak(e.say);setTimeout(()=>speak(e.say),250)}
    ({choice,build,shadow})[e.kind](e,$('#area'));
  }
  function choice(e,area){
    area.innerHTML=`<div class="opts">${e.opts.map((o,j)=>`<button class="opt ${o.he?'he':''}" data-j="${j}">${o.h}</button>`).join('')}</div>`;
    const btns=[...area.querySelectorAll('.opt')];
    const pickJ=j=>{if(btns[0].disabled)return;btns.forEach(b=>b.disabled=true);btns[e.ans].classList.add('ok');if(j!==e.ans)btns[j].classList.add('bad');answer(e,j===e.ans)};
    btns.forEach(b=>b.onclick=()=>pickJ(+b.dataset.j));
    KEYH=ev=>{const n=+ev.key;if(n>=1&&n<=btns.length)pickJ(n-1)};
  }
  function build(e,area){
    const cls=e.words?'tile wd':'tile';
    area.innerHTML=`<div class="answer" id="ans" aria-label="Tu respuesta" data-ph="${e.words?'La primera palabra va a la derecha →':'Empieza por la derecha: el hebreo se escribe de derecha a izquierda'}"></div><div class="tiles" id="tiles">${e.pieces.map((p,j)=>`<button class="${cls}" data-j="${j}">${p}</button>`).join('')}</div>
     <div class="row"><button class="btn primary" id="check" disabled>Comprobar</button><button class="btn" id="clear">Borrar</button></div>`;
    const ans=$('#ans'),chosen=[];
    const sync=()=>{ans.innerHTML=chosen.map((j,n)=>`<button class="${cls}" data-n="${n}">${e.pieces[j]}</button>`).join('');area.querySelectorAll('#tiles .tile').forEach(t=>t.hidden=chosen.includes(+t.dataset.j));$('#check').disabled=chosen.length!==e.target.length};
    $('#tiles').onclick=ev=>{const t=ev.target.closest('.tile');if(!t)return;chosen.push(+t.dataset.j);if(!e.words)speak(e.pieces[+t.dataset.j]);sync()};
    ans.onclick=ev=>{const t=ev.target.closest('.tile');if(!t)return;chosen.splice(+t.dataset.n,1);sync()};
    $('#clear').onclick=()=>{chosen.length=0;sync()};
    $('#check').onclick=()=>{const good=chosen.map(j=>e.pieces[j]).join('|')===e.target.join('|');area.querySelectorAll('button').forEach(b=>b.disabled=true);ans.style.borderColor=good?'var(--ok)':'var(--bad)';answer(e,good)};
  }
  function shadow(e,area){
    const l=e.line;
    area.innerHTML=`<div class="card"><div class="shadow-line">${lineText(l)}</div><p class="q-help"><i>${l.w.map(w=>w[1]).join(' ')}</i></p><p class="q-help">«${l.es}»</p></div>
     <p class="hint">1. Escucha. 2. Repite en voz alta al mismo tiempo que el audio. 3. Repite tú solo.</p>
     <div class="row"><button class="btn" data-say="${lineText(l)}" data-rate="0.55">Despacio</button><button class="btn" data-say="${lineText(l)}">Normal</button></div>
     <div class="row"><button class="btn primary" id="sh-ok">Lo dije bien</button><button class="btn" id="sh-bad">Me costó</button></div>`;
    $('#sh-ok').onclick=()=>{ok++;next()};$('#sh-bad').onclick=next;
  }
  function answer(e,good){
    if(good&&!e.retry)ok++;if(e.word&&!e.retry)srsHit(e.word,good);if(!good&&!e.retry)list.push(Object.assign({},e,{retry:true}));save();
    if(e.sayAfter)speak(e.sayAfter);
    $('#fb').innerHTML=`<div class="fb ${good?'ok':'bad'}"><h3>${good?'¡Correcto!':'Casi. Mira la respuesta:'}</h3>${!good&&!e.retry?'<p class="muted" style="font-size:14px">Volverá al final de la sesión.</p>':''}${e.explain?`<div>${e.explain}</div>`:''}<div class="row"><button class="btn primary" id="next">Continuar</button></div></div>`;
    const nb=$('#next');nb.onclick=next;nb.focus();
    KEYH=ev=>{if(ev.key==='Enter'){ev.preventDefault();next()}};
  }
  function next(){KEYH=null;i++;show()}
  function finish(){
    bumpStreak();save();chrome(null);
    const pct=total?Math.round(ok/total*100):0,pass=!retry||pct>=60;
    app.innerHTML=`<div class="stack" style="text-align:center;justify-items:center;padding-top:30px">
      <div class="he" style="font-size:40px;color:var(--accent)">${pct>=80?'כׇּל הַכָּבוֹד!':pass?'יוֹפִי!':'עוֹד פַּעַם!'}</div>
      <div class="score">${ok} / ${total}</div>
      <p class="muted">${pass?(pct>=80?'Muy bien. Las palabras volverán a tu repaso en unos días.':'Buen trabajo. Lo que fallaste volverá pronto en el repaso.'):'aciertos a la primera. Necesitas 60 % para completar este paso. Inténtalo otra vez: cada intento trae ejercicios distintos.'}</p>
      <div class="row" style="justify-content:center">${pass?'<button class="btn primary" id="fin">Continuar</button>':'<button class="btn primary" id="again">Intentar de nuevo</button><button class="btn" id="back">Volver</button>'}</div></div>`;
    if(pass)$('#fin').onclick=()=>onFinish&&onFinish(ok,total);
    else{$('#again').onclick=retry;$('#back').onclick=()=>backTo?backTo():home()}
  }
  if(!total){app.innerHTML='<p class="muted">No hay ejercicios disponibles todavía.</p>';return}
  show();
}

     <div class="row"><button class="btn primary" data-go="unit" data-u="0">${n?'Ir al camino':'Empezar la unidad 1'}</button></div></div></div>`;
    if(n)app.querySelector('[data-go="unit"]').dataset.go='home';
    return;}
  const learned=Object.keys(S.srs).map(k=>WORDS[k]).filter(Boolean);

  const syl=[];U.forEach((u,ui)=>{if(isDone(ui,'read'))syl.push(...ctxFor(ui).syl)});
  const x={pool,syl:uniqBy(syl,s=>s.c),u:U[0],letters:[]};
  const list=due.slice(0,12).map(k=>{const w=WORDS[k];for(const t of shuffle(['meaning','reverse','listen','build','meaning'])){const e=G[t](x,w);if(e){e.type=t;return e}}return null}).filter(Boolean);
  run(list,review,home);
}

// ponytail: sin 1, 2 ni 11-19 (cambian de forma ante sustantivo); añadir si se amplía el juego
function numHe(n){const t=n/10|0,u=n%10;if(n<10)return UNITS[n];if(!u)return TENS[t];return[TENS[t][0]+' '+VUNITS[u][0],TENS[t][1]+' '+VUNITS[u][1]]}
function price(r){if(r===0)return pick([10,20,30,40,50]);if(r===1)return pick([3,4,5,6,7,8,9,60,70,80,90]);let n;do{n=(2+Math.random()*8|0)*10+(Math.random()*10|0)}while(n%10===1);return n}

let PH=[];
const phr=a=>{PH.push(a);return`<button class="phr" data-ph="${PH.length-1}">${a[0]}</button>`};
function gShell(g,r,R,body){chrome('games');app.innerHTML=`<div class="run-top"><button class="back" data-go="games">✕ Salir</button><div class="bar"><span style="width:${r/R*100}%"></span></div><span class="cnt">${r+1} / ${R}</span></div><div class="ex"><div class="ex-type">${g.t} · <span class="he">${g.he}</span></div>${body}</div>`}
function gEnd(g,ok,tot){
  bumpStreak();const f=tot?ok/tot:0,st=f>=.9?3:f>=.6?2:1;S.games[g.id]=Math.max(S.games[g.id]||0,st);save();chrome('games');
  app.innerHTML=`<div class="stack" style="text-align:center;justify-items:center;padding-top:30px"><div class="big-stars" aria-label="${st} de 3 estrellas">${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>
   <div class="score">${ok} / ${tot}</div><p class="muted">aciertos a la primera. Las palabras nuevas ya están en tu repaso.</p>
   <div class="row" style="justify-content:center"><button class="btn primary" id="again">Jugar otra vez</button><button class="btn" data-go="games">Otros juegos</button></div></div>`;
  $('#again').onclick=()=>g.fn(g);
}
function nextBtn(label,fn){$('#fb').insertAdjacentHTML('beforeend',`<div class="row"><button class="btn primary" id="nx">${label}</button></div>`);const nx=$('#nx');nx.onclick=fn;nx.focus({preventScroll:true});nx.scrollIntoView({block:'nearest',behavior:'smooth'})}

// Supermercado: leer la lista (con vocales, sin vocales y de oído) y encontrar los productos
function gSuper(g){
  const R=4;let r=0,ok=0,tot=0;
  function round(){
    PH=[];const mode=['nik','nik','plain','audio'][r],n=r<2?3:4;
    const list=shuffle(FOOD).slice(0,n),shelf=shuffle([...list,...shuffle(FOOD.filter(f=>!list.includes(f))).slice(0,8-n)]);
    const got=new Set();let err=0;
    const chip=(f,i)=>mode==='nik'?phr(f):mode==='plain'?`<button class="chip he" data-say="${f[0]}">${strip(f[0])}</button>`:`<button class="chip" data-say="${f[0]}">${SPK} ${i+1}</button>`;
    const hint={nik:'Lee la lista y toca cada producto en el estante. Toca una palabra de la lista para oírla.',plain:'Ahora sin vocales, como en los carteles de un súper en Israel.',audio:'Ahora solo de oído: toca cada número para escuchar el producto.'}[mode];
    gShell(g,r,R,`<h2>Lista de compras <span class="he muted" style="font-weight:400">רְשִׁימַת קְנִיּוֹת</span></h2><p class="hint">${hint}</p>
      <div class="glist">${list.map((f,i)=>`<span class="chipw" data-li="${i}">${chip(f,i)}</span>`).join('')}</div>
      <div class="shelf">${shelf.map((f,i)=>`<button class="prod" data-p="${i}" aria-label="Producto ${i+1}"><span class="emo">${f[3]}</span><span class="pl he"></span></button>`).join('')}</div><div id="fb"></div>`);
    if(mode==='audio')setTimeout(()=>speak(list.map(f=>f[0]).join(', ')),300);
    document.querySelector('.shelf').onclick=e=>{
      const b=e.target.closest('.prod');if(!b||got.size===n)return;const f=shelf[+b.dataset.p],i=list.indexOf(f);
      b.querySelector('.pl').textContent=mode==='plain'?strip(f[0]):f[0];speak(f[0]);
      if(i<0){err++;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake','no');return}
      if(got.has(i))return;got.add(i);b.classList.add('yes');srsHit(bare(f[0]),true);
      document.querySelector(`.chipw[data-li="${i}"]`).classList.add('got');
      if(got.size===n){ok+=Math.max(n-err,0);tot+=n;save();
        $('#fb').innerHTML=`<div class="fb ${err?'bad':'ok'}"><h3>${err?`Carrito completo, con ${err} ${err===1?'error':'errores'}`:'¡Carrito completo sin errores!'}</h3><div>${list.map(f=>`<span class="he say">${f[0]}</span> <i class="muted">${f[1]}</i> = ${f[2]}`).join('<br>')}</div></div>`;
        nextBtn(r+1<R?'Siguiente lista':'Terminar',()=>{r++;r<R?round():gEnd(g,ok,tot)})}
    };
  }
  round();
}

// Caja: entender un precio dicho en hebreo y pagar exacto
function gCaja(g){
  const R=5,COINS=[1,2,5,10,20,50];let r=0,ok=0;
  function round(){
    PH=[];const n=price(r),nh=numHe(n),parts=[['זֶה עוֹלֶה','ze olé','cuesta'],[nh[0],nh[1],'número '+n],['שְׁקָלִים','shkalím','shekels']];
    const sent=parts.map(p=>p[0]).join(' '),tray=[];
    gShell(g,r,R,`<h2>¿Cuánto cuesta?</h2><p class="hint">Escucha a la cajera y paga exacto. Toca una palabra para ver cómo se pronuncia.</p>
      <div class="chat"><div class="bub them"><span class="who">Cajera · קֻפָּאִית</span><div class="say-line">${parts.map(phr).join('')}</div></div></div>
      <div class="row"><button class="btn" data-say="${sent}">${SPK} Otra vez</button><button class="btn" data-say="${sent}" data-rate="0.55">Despacio</button></div>
      <div class="tray" id="tray"></div><div class="row" style="justify-content:center"><b id="sum"></b></div>
      <div class="money">${COINS.map(c=>`<button class="${c>=20?'bill':'coin'}" data-c="${c}">₪${c}</button>`).join('')}</div>
      <div class="row" style="justify-content:center"><button class="btn primary" id="pay" disabled>Pagar</button><button class="btn" id="clr">Borrar</button></div><div id="fb"></div>`);
    setTimeout(()=>speak(sent),300);
    const sum=()=>tray.reduce((a,b)=>a+b,0);
    const draw=()=>{$('#tray').innerHTML=tray.map((c,j)=>`<button class="${c>=20?'bill':'coin'}" data-t="${j}" aria-label="Quitar ₪${c}">₪${c}</button>`).join('');$('#sum').textContent='Has puesto ₪'+sum();$('#pay').disabled=!sum()};
    document.querySelector('.money').onclick=e=>{const b=e.target.closest('[data-c]');if(b&&!b.disabled){tray.push(+b.dataset.c);draw()}};
    $('#tray').onclick=e=>{const b=e.target.closest('[data-t]');if(b&&!b.disabled){tray.splice(+b.dataset.t,1);draw()}};
    $('#clr').onclick=()=>{tray.length=0;draw()};
    $('#pay').onclick=()=>{const s=sum(),good=s===n;if(good)ok++;
      document.querySelectorAll('.money button,#tray button,#pay,#clr').forEach(b=>b.disabled=true);
      speak(good?'תּוֹדָה רַבָּה!':sent);
      $('#fb').innerHTML=`<div class="fb ${good?'ok':'bad'}"><h3>${good?'¡Exacto! תּוֹדָה רַבָּה':`Costaba ₪${n}: ${s>n?'pagaste de más':'te faltó dinero'}`}</h3><div><span class="he say" style="font-size:22px">${nh[0]}</span> · <i>${nh[1]}</i> = ${n}</div></div>`;
      nextBtn(r+1<R?'Siguiente cliente':'Terminar',()=>{r++;r<R?round():gEnd(g,ok,R)})};
    draw();
  }
  round();
}

const CAFE=[
 {w:['שָׁלוֹם! מָה תִּרְצֶה?','shalóm! ma tirtsé?','¡Hola! ¿Qué vas a querer?'],k:'drink',o:{cafe:['קָפֶה הָפוּךְ, בְּבַקָּשָׁה','kafé hafúj, bevakashá'],te:['תֵּה, בְּבַקָּשָׁה','te, bevakashá']}},
 {w:['גָּדוֹל אוֹ קָטָן?','gadól o katán?','¿Grande o pequeño?'],k:'size',o:{g:['גָּדוֹל, בְּבַקָּשָׁה','gadól, bevakashá'],p:['קָטָן, בְּבַקָּשָׁה','katán, bevakashá']}},
 {w:['עוֹד מַשֶּׁהוּ?','od máshehu?','¿Algo más?'],k:'extra',o:{c:['כֵּן, גַּם קְרוּאָסוֹן','ken, gam kruasón'],n:['לֹא, זֶה הַכֹּל, תּוֹדָה','lo, ze ha-kól, todá']}},
 {w:['לְכָאן אוֹ לָלֶכֶת?','le-kán o laléjet?','¿Para tomar aquí o para llevar?'],k:'where',o:{a:['לְכָאן','le-kán'],l:['לָלֶכֶת','laléjet']}},
];
const CAFE_X=[['לַיְלָה טוֹב','láila tov'],['אֲנִי לֹא יוֹדֵעַ','aní lo yodéa'],['לְהִתְרָאוֹת!','lehitraót'],['אֲנִי בַּבַּיִת','aní ba-báyit'],['יֵשׁ לִי כֶּלֶב','yesh li kélev']];
const GOALS={drink:{cafe:'<span class=\"emo\">☕</span> café con leche',te:'<span class=\"emo\">🍵</span> té'},size:{g:'grande',p:'pequeño'},extra:{c:'<span class=\"emo\">🥐</span> con cruasán',n:'nada más'},where:{a:'para tomar aquí',l:'<span class=\"emo\">🥡</span> para llevar'}};
function gCafe(g){
  const R=2;let r=0,ok=0,tot=0;
  function round(){
    PH=[];const goal={};CAFE.forEach(s=>goal[s.k]=pick(Object.keys(s.o)));let step=0;
    gShell(g,r,R,`<h2>Pide en el café</h2><div class="goal"><b>Tu pedido:</b>${CAFE.map(s=>`<span>${GOALS[s.k][goal[s.k]]}</span>`).join('<span aria-hidden="true">·</span>')}</div>
      <label class="chk"><input type="checkbox" id="g-tr" ${S.gtr?'checked':''}> Mostrar transliteración</label>
      <div class="chat" id="chat"></div><div id="opts"></div><div id="fb"></div>`);
    $('#g-tr').onchange=e=>{S.gtr=e.target.checked;save();document.querySelectorAll('#chat .t,#opts .t').forEach(x=>x.hidden=!S.gtr)};
    const chat=$('#chat');
    const say=(a,me)=>{chat.insertAdjacentHTML('beforeend',`<div class="bub ${me?'me':'them'}"><span class="who">${me?'Tú':'Mesero · מֶלְצַר'}</span><span class="he" style="font-size:22px">${a[0]}</span><span class="t" ${S.gtr?'':'hidden'}>${a[1]}</span>${!me&&a[2]?`<details><summary>¿Qué dice?</summary>${a[2]}</details>`:''}</div>`);speak(a[0])};
    function ask(){
      if(step>=CAFE.length){say(['בְּתֵאָבוֹן!','betéavon','¡Buen provecho!']);$('#opts').innerHTML='';
        $('#fb').innerHTML='<div class="fb ok"><h3>¡Pedido listo!</h3></div>';nextBtn(r+1<R?'Siguiente cliente':'Terminar',()=>{r++;r<R?round():gEnd(g,ok,tot)});return}
      const s=CAFE[step],right=s.o[goal[s.k]];let miss=false;say(s.w);
      const opts=shuffle([right,...Object.keys(s.o).filter(k=>k!==goal[s.k]).map(k=>s.o[k]),pick(CAFE_X)]);
      $('#opts').innerHTML=`<p class="hint">Responde según tu pedido:</p><div class="opts">${opts.map((o,j)=>`<button class="opt he" data-j="${j}">${o[0]}<span class="t" ${S.gtr?'':'hidden'}>${o[1]}</span></button>`).join('')}</div>`;
      $('#opts').onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;const o=opts[+b.dataset.j];
        if(o===right){tot++;if(!miss)ok++;document.querySelectorAll('#opts .opt').forEach(x=>x.disabled=true);say(o,true);step++;setTimeout(ask,1600)}
        else{miss=true;b.disabled=true;b.classList.add('bad');say(['סְלִיחָה, לֹא הֵבַנְתִּי.','slijá, lo hevánti','Perdón, no entendí.'])}};
      $('#opts').scrollIntoView({block:'nearest',behavior:'smooth'});
    }
    ask();
  }
  round();
}

// Taxi: entender el destino y seguir indicaciones
function gTaxi(g){
  const R=4;let r=0,ok=0,tot=0;
  function round(){
    PH=[];const opts=shuffle(PLACES).slice(0,6),p=pick(opts),audio=r>=2;let miss=false;
    const req=[p[4]+', בְּבַקָּשָׁה',p[5]+', bevakashá','A '+p[2]+', por favor'];
    gShell(g,r,R,`<h2>¿A dónde va?</h2><p class="hint">${audio?'Ahora solo de oído: escucha al pasajero.':'Lee o escucha al pasajero y elige su destino. Toca la frase para ver cómo se pronuncia.'}</p>
      <div class="chat"><div class="bub them"><span class="who">Pasajero · נוֹסֵעַ</span>${audio?`<button class="btn" data-say="${req[0]}">${SPK} Escuchar</button>`:phr(req)}</div></div>
      <div class="places">${opts.map((o,j)=>`<button class="prod" data-j="${j}"><span class="emo">${o[3]}</span><span class="pl">${o[2]}</span></button>`).join('')}</div><div id="fb"></div>`);
    setTimeout(()=>speak(req[0]),300);
    document.querySelector('.places').onclick=e=>{const b=e.target.closest('.prod');if(!b||b.disabled)return;const o=opts[+b.dataset.j];
      if(o!==p){miss=true;b.disabled=true;b.classList.add('no','shake');return}
      tot++;if(!miss)ok++;srsHit(bare(p[0]),!miss);save();b.classList.add('yes');
      document.querySelectorAll('.places .prod').forEach(x=>x.disabled=true);drive(p)};
  }
  function drive(p){
    const steps=Array.from({length:3},()=>pick(DIRS)),route=[];let k=0,miss=false;
    $('#fb').innerHTML=`<div class="card"><h3>Sigue las indicaciones del pasajero</h3><div class="chat" id="dchat"></div><div class="route" id="route" aria-live="polite">🚕</div>
      <div class="arrows">${[['←','Izquierda'],['↑','Recto'],['→','Derecha']].map(a=>`<button data-a="${a[0]}" aria-label="${a[1]}">${a[0]}</button>`).join('')}</div></div>`;
    const show=()=>{
      if(k>=steps.length){const end=['פֹּה, תּוֹדָה!','po, todá','¡Aquí, gracias!'];$('#dchat').innerHTML=`<div class="bub them">${phr(end)}</div>`;speak(end[0]);
        $('#fb').insertAdjacentHTML('beforeend',`<div class="fb ok"><h3>¡Llegaste: <span class="emo">${p[3]}</span> ${p[2]}!</h3><div><span class="he say">${p[0]}</span> <i class="muted">${p[1]}</i></div></div>`);
        nextBtn(r+1<R?'Siguiente pasajero':'Terminar',()=>{r++;r<R?round():gEnd(g,ok,tot)});return}
      miss=false;const d=steps[k];$('#dchat').innerHTML=`<div class="bub them">${phr(d)}</div>`;speak(d[0])};
    document.querySelector('.arrows').onclick=e=>{const b=e.target.closest('[data-a]');const d=steps[k];if(!b||!d)return;
      if(b.dataset.a!==d[3]){miss=true;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');return}
      tot++;if(!miss)ok++;srsHit(bare(d[0]),!miss);save();route.push(d[3]);$('#route').textContent='🚕 '+route.join(' ');k++;
      if(k>=steps.length)document.querySelectorAll('.arrows button').forEach(x=>x.disabled=true);show()};
    show();$('#fb').scrollIntoView({block:'nearest',behavior:'smooth'});
  }
  round();
}

function parseVerb(f){

  const past=Object.assign({s1:P(12),s3m:P(14),s3f:P(16),p3:P(18)},pastFrom(P(12)));
  const fut=Object.assign({s1:P(20),s3m:P(22),p3:P(24)},futFrom(P(22),P(24)));
  f.slice(26).forEach(ov=>{const m=ov.match(/^(\w+)=([^:]+):(.+)$/);if(m)past[m[1]]=[NF(m[2]),m[3]]});

  if(id==='verbs'){app.innerHTML=`${back}<div class="stack"><h1>Tablas de verbos</h1><p class="hint">${VERBS.length} verbos en infinitivo, presente, pasado y futuro. Toca uno para ver su tabla y practicarlo.</p>
     <input class="search" type="search" id="vs" placeholder="Busca un verbo" aria-label="Buscar verbo"><div class="wlist" id="vl"></div></div>`;
    const draw=q=>{$('#vl').innerHTML=VERBS.filter(v=>!q||fold(v.he+v.tr+v.es).includes(q)).map(v=>`<button class="wrow" data-verb="${v.k}"><span class="he">${v.he}</span><span><i class="muted">${v.tr}</i> · ${v.es}<small class="meta">${v.c.pres?'<span class="he">'+v.c.pres.m[0]+'</span> · ':''}<span class="he">${v.c.past.s3m[0]}</span> · <span class="he">${v.c.fut.s3m[0]}</span></small></span>${lvl(v.k)}</button>`).join('')};
    draw('');$('#vs').oninput=e=>draw(fold(e.target.value.trim()));return}
  if(id==='preps'){app.innerHTML=`${back}<div class="stack"><h1>Preposiciones con pronombre</h1><p class="hint">En hebreo la preposición y el pronombre se escriben juntos. Toca una fila para oírla.</p>
     ${PREPS.map(p=>`<h3><span class="he">${p.p}</span> · ${p.es}</h3><div class="tbl"><table class="vt ct"><tbody>${p.f.map((f,i)=>`<tr data-say="${f[0]}"><td><span class="he">${PRON_HE[i]}</span> <small class="muted">${PRON[i]}</small></td><td class="he">${f[0]}</td><td><i>${f[1]}</i></td></tr>`).join('')}</tbody></table></div>`).join('')}
     <div class="row"><button class="btn primary" data-skill="prep">Practicar</button></div></div>`;return}
  if(id==='nums'){const tr=r=>`<tr data-say="${r[1]}"><td>${r[0]}</td><td class="he">${r[1]}</td><td><i>${r[2]}</i></td></tr>`;
    app.innerHTML=`${back}<div class="stack"><h1>Números y la hora</h1><p class="hint">La forma femenina se usa para contar, para la hora y con sustantivos femeninos. La masculina, con sustantivos masculinos (y termina en ־ָה).</p>
     <h3>Femenino (para contar)</h3><div class="tbl"><table class="vt ct"><tbody>${NUMF.map(tr).join('')}</tbody></table></div>
     <h3>Masculino</h3><div class="tbl"><table class="vt ct"><tbody>${NUMM.map(tr).join('')}</tbody></table></div>
     <h3>La hora</h3><div class="tbl"><table class="vt ct"><tbody>${[[3,0],[3,15],[3,30],[12,0],[1,30]].map(([h,m])=>{const t=timeHe(h,m);return tr([h+':'+String(m).padStart(2,'0'),t[0],t[1]])}).join('')}</tbody></table></div>
     <div class="row"><button class="btn primary" data-skill="num">Practicar números</button><button class="btn" data-skill="time">Practicar la hora</button></div></div>`;return}
  if(id==='gram'){app.innerHTML=`${back}<div class="stack"><h1>Gramática A2</h1><p class="hint">Todas las reglas de la app. Toca el hebreo para oírlo.</p>
     ${EXTRA_GRAM.map(n=>`<div class="card"><h3>${n[0]}</h3><p>${n[1]}</p></div>`).join('')}
     ${U.map((u,i)=>`<h2>${i+1}. ${u.t}</h2>${u.gram.notes.map(n=>`<div class="card"><h3>${n[0]}</h3><p>${n[1]}</p></div>`).join('')}`).join('')}
     <div class="row"><button class="btn primary" data-skill="syn">Practicar frases</button><button class="btn" data-skill="units">Practicar gramática de las lecturas</button></div></div>`;return}
}

// ---------- Navegación ----------
document.addEventListener('click',e=>{
  const t=e.target;
  if(popFor&&!t.closest('#pop')&&!popFor.contains(t))hidePop();
  const g=t.closest('[data-go]');
  if(g){const v=g.dataset.go,V={home,alef,words,review,games,voc,prac};V[v]?V[v]():unit(+g.dataset.u,g.dataset.tab);return}
  const dk=t.closest('[data-deck]');if(dk){deckView(dk.dataset.deck);return}
  const vk=t.closest('[data-vk]');if(vk&&VOCK[vk.dataset.vk]){vocSheet(VOCK[vk.dataset.vk]);return}
  const vr=t.closest('[data-verb]');if(vr&&VERBK[vr.dataset.verb]){verbSheet(VERBK[vr.dataset.verb]);return}
  const vp=t.closest('[data-vprac]');if(vp){practiceVerb(vp.dataset.vprac);return}
  const sk=t.closest('[data-skill]');if(sk){closeSheet();startSkill(sk.dataset.skill);return}
  const rs=t.closest('[data-res]');if(rs){resPage(rs.dataset.res);return}
  const ph=t.closest('[data-ph]');if(ph){tapWord(ph,PH[+ph.dataset.ph]);return}
  const gm=t.closest('[data-game]');if(gm){const G0=GAMES.find(x=>x.id===gm.dataset.game);G0.fn(G0);return}
  const s=t.closest('[data-say]');if(s){speak(s.dataset.say,s.dataset.rate?+s.dataset.rate:undefined);return}
  const sy=t.closest('.say');if(sy){speak(sy.textContent);return}
  const w=t.closest('[data-word]');if(w){const o=WORDS[w.dataset.word];wordSheet(o.k,o.tr,o.es,o.note);return}
  const c=t.closest('button[data-cl]');if(c){tapLetter(c,c.dataset.cl);return}
  if(t.closest('#sheet-close'))closeSheet();
});
home();
</script>

  <button type="button" id="install-x" aria-label="Cerrar aviso">✕</button>
</div>

#install-tip{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--ink);color:var(--paper);font-size:14px;box-shadow:var(--shadow)}
#install-tip[hidden]{display:none}
#install-tip svg{width:16px;height:16px;fill:currentColor;vertical-align:-3px}
#install-tip button{margin-left:auto;border:0;background:none;color:inherit;font-size:16px;cursor:pointer}
@media (min-width:641px){#install-tip{bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto}}
</style>
<script>
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(()=>{const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
 const app=navigator.standalone||matchMedia('(display-mode: standalone)').matches;let off=false;try{off=localStorage.getItem('hideInstall')==='1'}catch(e){}
 const tip=document.getElementById('install-tip');if(ios&&!app&&!off)tip.hidden=false;
 document.getElementById('install-x').onclick=()=>{tip.hidden=true;try{localStorage.setItem('hideInstall','1')}catch(e){}}})();
</script>
